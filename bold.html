
<div class="invoice-template template-bold">
  <div class="inv-topline">
    <div>
      <p class="inv-brand-name" data="biz.name"></p>
      <div class="inv-brand-meta" data="biz.meta"></div>
    </div>
    <div class="inv-title-block">
      <p class="inv-title" data="meta.title"></p>
      <div class="inv-num" data="meta.no"></div>
    </div>
  </div>
  <div class="inv-body"><hr class="inv-rule">
  <div class="inv-parties">
    <div><h4>Billed to</h4><div class="name" data="cli.name"></div><div class="line" data="cli.meta"></div></div>
    <div><h4>Invoice details</h4><div class="line" data="meta.details"></div></div>
  </div>
  <table class="inv-items"><thead><tr><th style="width:8%">Sr</th><th style="width:42%">Item</th><th class="num" style="width:12%">Qty</th><th class="num" style="width:18%">Rate</th><th class="num" style="width:20%">Amount</th></tr></thead><tbody data-items></tbody></table>
  <div class="inv-bottom"><div class="inv-notes" data-notes></div><div class="inv-totals" data-totals></div></div>
  <div class="inv-footer"><div class="inv-bank" data-bank></div><div class="inv-sig" data-signature></div></div></div>
</div>
<script>
window.applyInvoiceTemplate = function(preview, d) {
  const esc = d.esc;
  const metaText = (o) => [o.email,o.phone,o.address].filter(Boolean).map(esc).join('<br>');
  preview.querySelector('[data="biz.name"]').textContent = d.biz.name;
  preview.querySelector('[data="biz.meta"]').innerHTML = metaText(d.biz);
  preview.querySelector('[data="meta.title"]').textContent = d.meta.title;
  preview.querySelector('[data="meta.no"]').textContent = d.meta.no ? '# ' + d.meta.no : '';
  preview.querySelector('[data="cli.name"]').textContent = d.cli.name;
  preview.querySelector('[data="cli.meta"]').innerHTML = metaText(d.cli);
  preview.querySelector('[data="meta.details"]').innerHTML =
    (d.meta.date ? 'Date: ' + esc(d.fmtDate(d.meta.date)) + '<br>' : '') +
    (d.meta.due ? 'Due: ' + esc(d.fmtDateShort(d.meta.due)) : '');
  preview.querySelector('[data-items]').innerHTML = d.itemsRows;
  preview.querySelector('[data-notes]').innerHTML = d.terms ? '<h4>Notes</h4><div>'+esc(d.terms).replace(/\n/g,'<br>')+'</div>' : '';
  preview.querySelector('[data-totals]').innerHTML =
    '<div class="r"><span>Subtotal</span><span>'+d.fmt(d.subtotal)+'</span></div>' +
    (d.discountAmt>0?'<div class="r"><span>Discount</span><span>-'+d.fmt(d.discountAmt)+'</span></div>':'') +
    (d.couponAmt>0?'<div class="r"><span>Coupon '+(d.couponCode?'('+esc(d.couponCode)+')':'')+'</span><span>-'+d.fmt(d.couponAmt)+'</span></div>':'') +
    (d.gstAmt>0?'<div class="r"><span>GST ('+d.gstPct+'%)</span><span>'+d.fmt(d.gstAmt)+'</span></div>':'') +
    (d.cgstAmt>0?'<div class="r"><span>CGST ('+d.cgstPct+'%)</span><span>'+d.fmt(d.cgstAmt)+'</span></div>':'') +
    (d.sgstAmt>0?'<div class="r"><span>SGST ('+d.sgstPct+'%)</span><span>'+d.fmt(d.sgstAmt)+'</span></div>':'') +
    (d.extraAmt>0?'<div class="r"><span>'+esc(d.extraLabel)+'</span><span>'+d.fmt(d.extraAmt)+'</span></div>':'') +
    '<div class="r grand"><span>Total</span><span>'+d.fmt(d.grandTotal)+'</span></div>' +
    '<div class="inv-words">Rupees '+esc(d.numToWords(d.grandTotal))+' Only</div>';
  preview.querySelector('[data-bank]').innerHTML =
    ((d.bankName||d.bankAcc||d.bankIfsc||d.upiId) ? '<h4>Payment details</h4>' +
      (d.bankName?'Bank: '+esc(d.bankName)+'<br>':'') +
      (d.bankAcc?'A/c No: '+esc(d.bankAcc)+'<br>':'') +
      (d.bankIfsc?'IFSC: '+esc(d.bankIfsc)+'<br>':'') +
      (d.upiId?'UPI: '+esc(d.upiId):'') : '') +
    (d.thankYou?'<div class="inv-thankyou">'+esc(d.thankYou)+'</div>':'');
  preview.querySelector('[data-signature]').innerHTML = d.sigHtml + '<div class="sig-line">Authorised signatory</div>';
};
</script>
<style>
.template-bold{font-family:Manrope,sans-serif;padding:0}.template-bold .inv-topline{background:#14213d;color:#fff;padding:34px 44px}.template-bold .inv-brand-name{color:#fff}.template-bold .inv-brand-meta,.template-bold .inv-num{color:#c7cde0}.template-bold .inv-title{color:#ff6b35;font-family:Sora,sans-serif}.template-bold .inv-body{padding:34px 44px 44px}.template-bold table.inv-items thead th{border-bottom:2px solid #ff6b35;font-family:Sora,sans-serif}.template-bold .inv-totals .r.grand{color:#ff6b35;border-top-color:#14213d}.template-bold .inv-parties h4{color:#ff6b35}
</style>
