<div class="invoice template-classic">
  <div class="inv-topline">
    <div>
      <p class="inv-brand-name" data-biz-name></p>
      <div class="inv-brand-meta" data-biz-meta></div>
    </div>
    <div class="inv-title-block">
      <p class="inv-title" data-title></p>
      <div class="inv-num" data-number></div>
    </div>
  </div>
  <div class="inv-body">
    <hr class="inv-rule">
    <div class="inv-parties">
      <div><h4>Billed to</h4><div class="name" data-client-name></div><div class="line" data-client-meta></div></div>
      <div><h4>Invoice details</h4><div class="line" data-invoice-details></div></div>
    </div>
    <table class="inv-items"><thead><tr><th style="width:8%">Sr</th><th style="width:42%">Item</th><th class="num" style="width:12%">Qty</th><th class="num" style="width:18%">Rate</th><th class="num" style="width:20%">Amount</th></tr></thead><tbody data-items></tbody></table>
    <div class="inv-bottom"><div class="inv-notes" data-notes></div><div class="inv-totals" data-totals></div></div>
    <div class="inv-footer"><div class="inv-bank" data-bank></div><div class="inv-sig" data-signature></div></div>
  </div>
</div>
<style>
.template-classic{font-family:Georgia,serif;border:1.5px solid #1c1b19}.template-classic .inv-topline{border-bottom:3px double #1c1b19}.template-classic .inv-brand-name,.template-classic .inv-title{font-family:Georgia,serif}.template-classic .inv-title{color:#5a1c1c}.template-classic table.inv-items thead th{border-bottom:2px solid #1c1b19}.template-classic .inv-totals .r.grand{color:#5a1c1c}
</style>
